name: Bug report
description: Something in Compendio behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much as you can.
        Do **not** paste secrets, passwords, or encrypted-folder contents.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Steps to reproduce, expected vs. actual behaviour.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From `GET /api/v1/about` or the footer of any page.
      placeholder: e.g. 1.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: How is it running?
      options:
        - Windows Service
        - systemd (Linux)
        - Docker
        - Standalone executable / development
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - Español
        - English
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant log output, with secrets removed.
      render: shell
    validations:
      required: false

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: publish (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: linux-arm64
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Build the client
        working-directory: src/client
        run: |
          npm ci --no-audit --no-fund
          npm run check:i18n
          npm run build

      - name: Publish
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="${{ inputs.version }}"

          # Self-contained, single-file, untrimmed. Trimming breaks EF Core, and ~100 MB is the
          # accepted price of "download one file and run it".
          dotnet publish src/Server/Compendio.Server.csproj \
            -c Release \
            -r ${{ matrix.runtime }} \
            -o artifacts/${{ matrix.runtime }} \
            -p:SelfContainedPublish=true \
            -p:SkipClientBuild=true \
            -p:Version="$VERSION"

      # The installer has to be inside the download. Telling somebody to unzip one thing and then
      # go and find a script in a repository is the install experience this script exists to end.
      - name: Include the installer
        if: matrix.runtime == 'win-x64'
        shell: bash
        run: cp deploy/install-windows.ps1 artifacts/win-x64/

      - name: Archive and checksum
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="${{ inputs.version }}"
          NAME="compendio-$VERSION-${{ matrix.runtime }}.zip"

          cd artifacts/${{ matrix.runtime }}
          if command -v zip >/dev/null; then zip -qr "../$NAME" .; else
            powershell -Command "Compress-Archive -Path * -DestinationPath ../$NAME"
          fi
          cd ..

          # Published beside the artifact because releases are unsigned by decision. A checksum is
          # the honest substitute for a signature, and the README says so.
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME" > "$NAME.sha256"
          else
            powershell -Command "(Get-FileHash '$NAME' -Algorithm SHA256).Hash.ToLower() + '  $NAME' | Set-Content '$NAME.sha256'"
          fi

      # The tool has to be installed: it is not part of the SDK. Its command is `sbom-tool`, not
      # `dotnet sbom-tool` — `dotnet <name>` resolves a `dotnet-<name>` executable, which this is
      # not, and the resulting "command or file was not found" was swallowed by continue-on-error
      # for two releases. Both v1.0.0 and v1.0.1 shipped without the manifest this step promises.
      - name: Software bill of materials
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="${{ inputs.version }}"

          dotnet tool install --global Microsoft.Sbom.DotNetTool
          export PATH="$PATH:$HOME/.dotnet/tools"

          sbom-tool generate -b artifacts/${{ matrix.runtime }} -bc . -pn Compendio -pv "$VERSION" -ps Compendio -nsb https://github.com/shernandezp

          # Flattened to a name that carries the runtime. The tool always writes
          # `_manifest/spdx_2.2/manifest.spdx.json`, three matrix jobs share one release, and
          # assets are uploaded by base name — so uploading the tree as-is means three jobs
          # racing to claim one asset called `manifest.spdx.json`, which is both a collision and
          # a manifest nobody can tell the runtime of.
          MANIFEST=$(find "artifacts/${{ matrix.runtime }}/_manifest" -name manifest.spdx.json | head -1)

          if [ -n "$MANIFEST" ]; then
            cp "$MANIFEST" "artifacts/compendio-$VERSION-${{ matrix.runtime }}.spdx.json"
          else
            echo "::warning::No SPDX manifest was produced for ${{ matrix.runtime }}."
          fi
        continue-on-error: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*.spdx.json
          body: |
            ## Verifying your download

            Windows releases are **unsigned**. On first run, SmartScreen shows "Windows protected
            your PC" — click **More info → Run anyway**.

            Verify the checksum instead:

            ```powershell
            Get-FileHash .\compendio-*-win-x64.zip -Algorithm SHA256
            ```

            ```bash
            sha256sum -c compendio-*-linux-x64.zip.sha256
            ```

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Compendio

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Retried rather than run once: v1.0.1 failed here on `lookup ghcr.io … i/o timeout`, a DNS
      # timeout on the runner rather than anything about the credentials. A whole release job that
      # has to be re-run by hand because one UDP packet went missing is not a failure worth having.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; then
              exit 0
            fi

            echo "Login attempt $attempt failed."
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done

          echo "::error::Could not log in to ghcr.io after 3 attempts."
          exit 1

      # GHCR requires a lowercase image name, and github.repository carries the owner/name casing
      # verbatim — "shernandezp/Compendio". Lowercasing it here rather than renaming the repository
      # keeps the tag valid without changing anything a user has bookmarked.
      - name: Lowercase the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Compendio/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
